<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حاسبة المبيعات اليومية</title>

    <!-- PWA & App Icons Settings -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <meta name="theme-color" content="#10b981">

    <!-- Tailwind CSS & Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Toast -->
    <div id="toast"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-500 text-gray-900 font-bold px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 ease-out opacity-0 translate-y-10 pointer-events-none z-50 flex items-center gap-2">
        <span>تم نسخ التقرير بنجاح! 📋</span>
    </div>

    <div class="w-full max-w-2xl bg-gray-800 rounded-2xl shadow-2xl border border-gray-700 p-6 md:p-8 my-6">

        <!-- Header -->
        <div class="text-center mb-8">
            <img src="icon-192.png" alt="الشعار" class="w-20 h-20 mx-auto mb-4 rounded-2xl shadow-lg border border-gray-700 object-cover">

            <h1 class="text-2xl md:text-3xl font-bold text-emerald-400 mb-2">
                حاسبة المبيعات اليومية
            </h1>

            <p class="text-gray-400 text-sm">
                أدخل البيانات أدناه للحصول على تقرير اليوم تلقائياً
            </p>
            <p id="syncStatus" class="text-xs text-emerald-400/80 mt-1">متصل بالسحابة ☁️</p>
        </div>

        <!-- Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">

            <!-- Date -->
            <div class="md:col-span-2 flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    اختر التاريخ
                </label>

                <input type="date" id="yesterdayDate" onchange="calculate()"
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-right" />
            </div>

            <!-- Input 1 -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    ١- بطايق أمس (الرصيد السابق):
                </label>

                <input type="number" id="cardsYesterday" oninput="calculate()" placeholder="0.00"
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all" />
            </div>

            <!-- Input 2 -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    ٢- بطايق اليوم (الرصيد المتبقي):
                </label>

                <input type="number" id="cardsToday" oninput="calculate()" placeholder="0.00"
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all" />
            </div>

            <!-- Input 3 -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    ٣- الكاش المتوفر (إجمالي كاش اليوم):
                </label>

                <input type="number" id="cashAvailable" oninput="calculate()" placeholder="0.00"
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all" />
            </div>

            <!-- Input 4 -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    ٤- صافي الكاش من أمس:
                </label>

                <input type="number" id="cashYesterday" oninput="calculate()" placeholder="0.00"
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all" />
            </div>

            <!-- Input 5 -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    ٥- خرجيات اليوم:
                </label>

                <input type="number" id="expensesToday" oninput="calculate()" placeholder="0.00"
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all" />
            </div>

            <!-- Input 6 -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    ٦- الشبكة:
                </label>

                <input type="number" id="network" oninput="calculate()" placeholder="0.00"
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all" />
            </div>

            <!-- Notes Input -->
            <div class="md:col-span-2 flex flex-col gap-2">
                <label class="text-sm font-medium text-gray-300">
                    ملاحظات:
                </label>

                <textarea id="notesInput" rows="2" placeholder="أضف ملاحظات اليوم أو الغد هنا..."
                    class="bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-all text-right resize-none"></textarea>
            </div>

        </div>

        <hr class="border-gray-700 my-6" />

        <!-- Results -->
        <div class="bg-gray-900 rounded-xl p-5 border border-gray-700 space-y-4">

            <!-- Date -->
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <span class="text-gray-400 text-sm">التاريخ:</span>

                <span id="outDate" class="font-bold text-white text-base">-</span>
            </div>

            <!-- Details -->
            <div class="grid grid-cols-2 gap-4 text-xs text-gray-500 border-b border-gray-800 pb-3">

                <div>
                    شغل البطايق:
                    <span id="outCardWork" class="text-gray-300 font-medium">
                        0.00
                    </span>
                </div>

                <div>
                    صافي الكاش الحالي:
                    <span id="outNetCash" class="text-gray-300 font-medium">
                        0.00
                    </span>
                </div>

            </div>

            <!-- Final -->
            <div class="flex justify-between items-center pt-2">
                <span class="text-gray-300 font-medium">نقداً:</span>

                <span id="outCashRevenue"
                    class="font-bold text-xl text-emerald-400">
                    0.00
                </span>
            </div>

            <div class="flex justify-between items-center">
                <span class="text-gray-300 font-medium">شبكة:</span>

                <span id="outNetworkRevenue"
                    class="font-bold text-xl text-blue-400">
                    0.00
                </span>
            </div>

            <div class="border-t border-dashed border-gray-600 my-2"></div>

            <div class="flex justify-between items-center bg-gray-800 p-3 rounded-lg border border-gray-700">
                <span class="text-gray-200 font-bold text-lg">
                    الإجمالي:
                </span>

                <span id="outTotal"
                    class="font-black text-2xl text-amber-400">
                    0.00
                </span>
            </div>

        </div>

        <!-- Buttons -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">

            <button onclick="copyReport()"
                class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-xl transition-all text-sm font-bold shadow-lg cursor-pointer">
                نسخ التقرير 📋
            </button>

            <button onclick="sendWhatsApp()"
                class="bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-xl transition-all text-sm font-bold shadow-lg cursor-pointer">
                واتساب 📱
            </button>

            <button onclick="resetForm()"
                class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-medium py-3 rounded-xl border border-red-500/30 transition-all text-sm cursor-pointer">
                تفريغ الحقول
            </button>

        </div>

        <!-- Logs -->
        <div class="mt-8">

            <div class="flex items-center justify-between mb-4">

                <h2 class="text-lg font-bold text-white">
                    سجل آخر ٧ أيام
                </h2>

                <button onclick="clearLogs()"
                    class="text-xs text-red-400 hover:text-red-300 transition-all cursor-pointer">
                    حذف السجل بالكامل
                </button>

            </div>

            <div id="logsContainer" class="space-y-3"></div>

        </div>

    </div>

    <script>
        // SUPABASE CONFIGURATION
        const SUPABASE_URL = 'https://dixzjxphvbxxpmnmtxoo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Rb33yq79kPQYbuzZKlH1SA_rrG2Viuq';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Globals
        let formattedDateString = "-";
        let globalCash = 0;
        let globalNetwork = 0;
        let globalTotal = 0;

        // Set Default Today Date on Load
        window.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('yesterdayDate');
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            
            dateInput.value = `${year}-${month}-${day}`;
            calculate();
            fetchAndRenderLogs();
        });

        // Calculate
        function calculate() {
            const cardsYesterday = parseFloat(document.getElementById('cardsYesterday').value) || 0;
            const cardsToday = parseFloat(document.getElementById('cardsToday').value) || 0;
            const cashAvailable = parseFloat(document.getElementById('cashAvailable').value) || 0;
            const cashYesterday = parseFloat(document.getElementById('cashYesterday').value) || 0;
            const expensesToday = parseFloat(document.getElementById('expensesToday').value) || 0;
            const network = parseFloat(document.getElementById('network').value) || 0;

            const dateInput = document.getElementById('yesterdayDate').value;
            const outDateEl = document.getElementById('outDate');

            if (dateInput) {
                const parts = dateInput.split('-');
                const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);

                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'numeric',
                    day: 'numeric'
                };

                formattedDateString = dateObj.toLocaleDateString('ar-SA', options);
                outDateEl.innerText = formattedDateString;
            } else {
                formattedDateString = "-";
                outDateEl.innerText = "-";
            }

            const cardWork = cardsYesterday - cardsToday;
            const netCash = cashAvailable - cardWork;
            const totalSales = ((expensesToday + network) - cashYesterday) + netCash;
            const networkRevenue = network;
            const cashRevenue = totalSales - network;

            globalCash = cashRevenue;
            globalNetwork = networkRevenue;
            globalTotal = totalSales;

            document.getElementById('outCardWork').innerText = cardWork.toFixed(2);
            document.getElementById('outNetCash').innerText = netCash.toFixed(2);
            document.getElementById('outCashRevenue').innerText = cashRevenue.toFixed(2);
            document.getElementById('outNetworkRevenue').innerText = networkRevenue.toFixed(2);
            document.getElementById('outTotal').innerText = totalSales.toFixed(2);
        }

        function showToast(message = "تمت العملية بنجاح", success = true) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<span>${message}</span>`;

            toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 text-gray-900 font-bold px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 ease-out z-50 flex items-center gap-2 ${
                success ? 'bg-emerald-500' : 'bg-red-500'
            }`;

            toast.classList.remove('opacity-0', 'translate-y-10', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-10', 'pointer-events-none');
            }, 2000);
        }

        function generateReportText() {
            const notes = document.getElementById('notesInput').value.trim();
            let report = `${formattedDateString}

نقدا: ${globalCash.toFixed(0)}
شبكة: ${globalNetwork.toFixed(0)}
------------
الاجمالي: ${globalTotal.toFixed(0)}`;

            return report;
        }

        function copyReport() {
            const reportText = generateReportText();

            navigator.clipboard.writeText(reportText)
                .then(() => {
                    showToast("تم نسخ التقرير بنجاح 📋");
                })
                .catch(() => {
                    showToast("حدث خطأ أثناء النسخ!", false);
                });
        }

        async function sendWhatsApp() {
            const reportText = generateReportText();
            const encodedText = encodeURIComponent(reportText);

            await saveLog();

            window.open(
                `https://wa.me/?text=${encodedText}`,
                '_blank'
            );
        }

        // Save entry to Supabase (Upsert by date)
        async function saveLog() {
            const dateISO = document.getElementById('yesterdayDate').value;
            if (!dateISO || formattedDateString === "-") return;

            const logPayload = {
                date_iso: dateISO,
                log_date: formattedDateString,
                cards_yesterday: parseFloat(document.getElementById('cardsYesterday').value) || 0,
                cards_today: parseFloat(document.getElementById('cardsToday').value) || 0,
                cash_available: parseFloat(document.getElementById('cashAvailable').value) || 0,
                cash_yesterday: parseFloat(document.getElementById('cashYesterday').value) || 0,
                expenses_today: parseFloat(document.getElementById('expensesToday').value) || 0,
                network_input: parseFloat(document.getElementById('network').value) || 0,
                cash_revenue: globalCash.toFixed(2),
                network_revenue: globalNetwork.toFixed(2),
                total_sales: globalTotal.toFixed(2),
                notes: document.getElementById('notesInput').value.trim()
            };

            const { error } = await db
                .from('sales_logs')
                .upsert(logPayload, { onConflict: 'date_iso' });

            if (error) {
                showToast("فشل الحفظ في السحابة!", false);
                console.error(error);
            } else {
                showToast("تم حفظ التقرير في السحابة ☁️");
                fetchAndRenderLogs();
            }
        }

        // Fetch logs from Supabase
        async function fetchAndRenderLogs() {
            const container = document.getElementById('logsContainer');

            const { data: logs, error } = await db
                .from('sales_logs')
                .select('*')
                .order('date_iso', { ascending: false })
                .limit(7);

            if (error) {
                container.innerHTML = `
                    <div class="text-center text-red-400 text-sm py-4 border border-dashed border-red-500/30 rounded-xl">
                        خطأ في تحميل البيانات من السحابة
                    </div>
                `;
                return;
            }

            if (!logs || logs.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 text-sm py-4 border border-dashed border-gray-700 rounded-xl">
                        لا يوجد سجل حالياً
                    </div>
                `;
                return;
            }

            container.innerHTML = logs.map(log => `
                <div class="bg-gray-900 border border-gray-700 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-sm text-gray-400">${log.log_date}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-amber-400 font-bold">${log.total_sales}</span>
                            <button onclick="deleteSingleLog('${log.date_iso}')" 
                                class="text-red-400/70 hover:text-red-400 hover:bg-red-500/10 p-1.5 rounded-lg transition-all cursor-pointer" 
                                title="حذف هذا التقرير">
                                🗑️
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3 text-sm mb-4">
                        <div class="bg-gray-800 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">بطايق أمس</div>
                            <div class="text-white font-bold">${log.cards_yesterday}</div>
                        </div>

                        <div class="bg-gray-800 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">الرصيد المتبقي</div>
                            <div class="text-cyan-400 font-bold">${log.cards_today}</div>
                        </div>

                        <div class="bg-gray-800 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">الكاش المتوفر</div>
                            <div class="text-white font-bold">${log.cash_available}</div>
                        </div>

                        <div class="bg-gray-800 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">صافي كاش أمس</div>
                            <div class="text-white font-bold">${log.cash_yesterday}</div>
                        </div>

                        <div class="bg-gray-800 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">خرجيات اليوم</div>
                            <div class="text-white font-bold">${log.expenses_today}</div>
                        </div>

                        <div class="bg-gray-800 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">الشبكة</div>
                            <div class="text-blue-400 font-bold">${log.network_input}</div>
                        </div>
                    </div>

                    ${log.notes ? `
                        <div class="bg-gray-800/60 border border-gray-700/50 rounded-lg p-2.5 mb-3 text-xs text-gray-300">
                            <span class="font-bold text-emerald-400">ملاحظة: </span>${log.notes}
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-3 gap-3 text-sm border-t border-gray-800 pt-3">
                        <div class="bg-gray-800/50 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">نقداً</div>
                            <div class="text-emerald-400 font-bold">${log.cash_revenue}</div>
                        </div>

                        <div class="bg-gray-800/50 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">شبكة</div>
                            <div class="text-blue-400 font-bold">${log.network_revenue}</div>
                        </div>

                        <div class="bg-gray-800/50 rounded-lg p-2 text-center">
                            <div class="text-gray-400 text-xs mb-1">الإجمالي</div>
                            <div class="text-amber-400 font-bold">${log.total_sales}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Delete single report by date_iso
        async function deleteSingleLog(dateISO) {
            if (confirm("هل أنت تأكد من حذف هذا التقرير؟")) {
                const { error } = await db
                    .from('sales_logs')
                    .delete()
                    .eq('date_iso', dateISO);

                if (error) {
                    showToast("فشل حذف التقرير!", false);
                    console.error(error);
                } else {
                    showToast("تم حذف التقرير بنجاح 🗑️");
                    fetchAndRenderLogs();
                }
            }
        }

        async function clearLogs() {
            if (confirm("هل أنت متاكد من حذف جميع السجلات من السحابة؟")) {
                const { error } = await db.from('sales_logs').delete().neq('id', 0);
                if (error) {
                    showToast("فشل حذف السجل!", false);
                } else {
                    showToast("تم حذف السجل بالكامل");
                    fetchAndRenderLogs();
                }
            }
        }

        function resetForm() {
            document.getElementById('cardsToday').value = '';
            document.getElementById('cardsYesterday').value = '';
            document.getElementById('cashAvailable').value = '';
            document.getElementById('cashYesterday').value = '';
            document.getElementById('expensesToday').value = '';
            document.getElementById('network').value = '';
            document.getElementById('notesInput').value = '';

            calculate();
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registered Successfully!'))
                .catch((err) => console.log('Service Worker Registration Failed:', err));
        }
    </script>
</body>
</html>
